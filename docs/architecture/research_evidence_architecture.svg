<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg"><style>
  @page { size: 1600px 900px; margin: 0; }
  html,body { margin:0; width:1600px; height:900px; background:#f5f7fb; }
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  svg { display:block; width:1600px; height:900px; }
  .t { fill:#172033; }
  .muted { fill:#63738c; }
  .card { fill:#fff; stroke:#d4ddea; stroke-width:1.4; }
  .sub { fill:#fbfcff; stroke:#d9e1ed; stroke-width:1.2; }
  .kicker { font-size:12px; font-weight:800; letter-spacing:1.4px; fill:#65748c; }
  .title { font-size:21px; font-weight:760; fill:#172033; }
  .body { font-size:13px; fill:#61728b; }
  .small { font-size:11.5px; fill:#61728b; }
  .tiny { font-size:10px; fill:#61728b; }
  .strong { font-weight:750; fill:#172033; }
  .chip { fill:#f1f5ff; stroke:#dce6ff; stroke-width:1; }
  .chiptext { font-size:9.5px; font-weight:800; fill:#3159ad; }
  .arrowlbl { font-size:10px; font-weight:800; }
</style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#1b2535" flood-opacity=".07"/></filter>
    <marker id="blueA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2457ff"/></marker>
    <marker id="orangeA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
    <marker id="purpleA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6d4aff"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2457ff"/><stop offset="1" stop-color="#6487ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#118b58"/><stop offset="1" stop-color="#43b982"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d97706"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6746e8"/><stop offset="1" stop-color="#8b6cff"/></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="65" r="180" fill="#e8eeff" opacity=".55"/>
  <circle cx="80" cy="830" r="210" fill="#efebff" opacity=".5"/>

  <text x="48" y="57" font-size="34" font-weight="780" class="t">Research Evidence Agent — System Architecture</text>
  <text x="48" y="86" font-size="15" class="muted">Agentic decision-making with deterministic execution, explicit evidence, and a bounded safety layer.</text>

  <g transform="translate(1170,33)">
    <rect x="0" y="0" width="150" height="28" rx="14" fill="#fff" stroke="#d4ddea"/><circle cx="15" cy="14" r="5" fill="#2457ff"/><text x="27" y="18" font-size="10.5" font-weight="700" class="muted">Decision layer</text>
    <rect x="160" y="0" width="164" height="28" rx="14" fill="#fff" stroke="#d4ddea"/><circle cx="175" cy="14" r="5" fill="#138f5b"/><text x="187" y="18" font-size="10.5" font-weight="700" class="muted">Deterministic tools</text>
    <rect x="0" y="36" width="150" height="28" rx="14" fill="#fff" stroke="#d4ddea"/><circle cx="15" cy="50" r="5" fill="#d97706"/><text x="27" y="54" font-size="10.5" font-weight="700" class="muted">Runtime &amp; safety</text>
    <rect x="160" y="36" width="164" height="28" rx="14" fill="#fff" stroke="#d4ddea"/><circle cx="175" cy="50" r="5" fill="#6d4aff"/><text x="187" y="54" font-size="10.5" font-weight="700" class="muted">Observations &amp; output</text>
  </g>

  <g filter="url(#shadow)"><rect x="48" y="135" width="255" height="280" rx="20" class="card"/></g>
  <rect x="67" y="157" width="44" height="44" rx="12" fill="url(#blue)"/>
  <circle cx="89" cy="173" r="7" fill="#fff"/><path d="M76 195c2-9 24-9 26 0" fill="#fff"/>
  <text x="124" y="170" class="kicker">INPUT</text><text x="124" y="195" class="title">User Question</text>
  <text x="67" y="229" class="body"><tspan x="67" dy="0">Natural-language question about</tspan><tspan x="67" dy="19">the synthetic experiment corpus.</tspan><tspan x="67" dy="19">Can ask for facts, comparisons,</tspan><tspan x="67" dy="19">constraints, or missing evidence.</tspan></text>
  <rect x="67" y="315" width="217" height="82" rx="14" class="sub"/>
  <text x="82" y="337" font-size="12" class="strong">Example</text>
  <text x="82" y="358" class="small"><tspan x="82">“What F1 score did LoRA Small</tspan><tspan x="82" dy="17">achieve?”</tspan><tspan x="82" dy="17">“Which experiment used the least energy?”</tspan></text>

  <g filter="url(#shadow)"><rect x="360" y="135" width="365" height="280" rx="20" class="card"/></g>
  <rect x="379" y="157" width="44" height="44" rx="12" fill="url(#blue)"/>
  <rect x="389" y="167" width="24" height="24" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="401" cy="179" r="5" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="436" y="170" class="kicker">DECISION LAYER</text><text x="436" y="195" class="title">DecisionModel</text>
  <text x="379" y="227" class="body"><tspan x="379">Chooses exactly one next action from the question,</tspan><tspan x="379" dy="19">tool specifications, and previous observations.</tspan><tspan x="379" dy="19">The model never executes tools directly.</tspan></text>
  <rect x="379" y="286" width="327" height="50" rx="12" class="sub"/>
  <text x="393" y="305" font-size="12" class="strong">TransformersDecisionModel</text>
  <text x="393" y="323" class="tiny">Qwen3.5-2B on Colab GPU · one structured action per step</text>
  <rect x="379" y="347" width="158" height="49" rx="12" class="sub"/>
  <text x="392" y="366" font-size="12" class="strong">ToolAction</text><text x="392" y="383" class="tiny">tool + structured args</text>
  <rect x="548" y="347" width="158" height="49" rx="12" class="sub"/>
  <text x="561" y="366" font-size="12" class="strong">FinalAction</text><text x="561" y="383" class="tiny">answer + evidence IDs</text>

  <g filter="url(#shadow)"><rect x="782" y="135" width="770" height="280" rx="20" class="card"/></g>
  <rect x="801" y="157" width="44" height="44" rx="12" fill="url(#green)"/>
  <path d="M810 173h26v19h-26zM817 173v-5h12v5M810 180h26" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="858" y="170" class="kicker">DETERMINISTIC TOOL LAYER</text><text x="858" y="195" class="title">ToolRegistry &amp; Tools</text>
  <text x="801" y="227" class="body">Registry exposes exactly four ordinary-Python tools and returns a structured result or error observation.</text>

  <g>
    <rect x="801" y="254" width="355" height="68" rx="13" class="sub"/>
    <rect x="815" y="269" width="32" height="32" rx="9" fill="url(#blue)"/>
    <circle cx="829" cy="283" r="7" fill="none" stroke="#fff" stroke-width="2"/><path d="M834 288l7 7" stroke="#fff" stroke-width="2"/>
    <text x="860" y="277" font-size="12" class="strong">search_notes</text><text x="860" y="296" class="tiny">Lexical discovery - candidate IDs / snippets</text>
    <rect x="860" y="303" width="61" height="16" rx="8" class="chip"/><text x="890.5" y="314" text-anchor="middle" class="chiptext">Discovery</text>

    <rect x="1175" y="254" width="358" height="68" rx="13" class="sub"/>
    <rect x="1189" y="269" width="32" height="32" rx="9" fill="url(#purple)"/>
    <path d="M1198 275h13l6 6v14h-19zM1211 275v7h6" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="1234" y="277" font-size="12" class="strong">read_note</text><text x="1234" y="296" class="tiny">Authoritative content + experiment metadata</text>
    <rect x="1234" y="303" width="64" height="16" rx="8" class="chip"/><text x="1266" y="314" text-anchor="middle" class="chiptext">Grounding</text>

    <rect x="801" y="333" width="355" height="64" rx="13" class="sub"/>
    <rect x="815" y="347" width="32" height="32" rx="9" fill="url(#orange)"/>
    <rect x="821" y="352" width="20" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M824 358h14M824 363h3M831 363h3M824 368h3M831 368h3" stroke="#fff" stroke-width="1.7"/>
    <text x="860" y="355" font-size="12" class="strong">calculate</text><text x="860" y="374" class="tiny">Safe AST arithmetic · no eval / arbitrary code</text>

    <rect x="1175" y="333" width="358" height="64" rx="13" class="sub"/>
    <rect x="1189" y="347" width="32" height="32" rx="9" fill="url(#green)"/>
    <circle cx="1205" cy="363" r="10" fill="none" stroke="#fff" stroke-width="2"/><path d="M1199 363l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="1234" y="355" font-size="12" class="strong">check_constraints</text><text x="1234" y="374" class="tiny">Exact metadata requirements - pass / violations</text>
  </g>

  <g filter="url(#shadow)"><rect x="360" y="470" width="365" height="278" rx="20" class="card"/></g>
  <rect x="379" y="492" width="44" height="44" rx="12" fill="url(#orange)"/>
  <path d="M401 501l4 7 8 1-6 6 2 8-8-4-8 4 2-8-6-6 8-1z" fill="#fff"/>
  <text x="436" y="505" class="kicker">RUNTIME LAYER</text><text x="436" y="530" class="title">ResearchAgent Runtime</text>
  <text x="379" y="562" class="body"><tspan x="379">Executes selected actions, records observations, catches</tspan><tspan x="379" dy="18">tool errors, enforces max steps, and validates finals.</tspan></text>
  <rect x="379" y="611" width="327" height="96" rx="15" fill="#fafcff" stroke="#bdc9db" stroke-dasharray="4 4"/>
  <g>
    <rect x="392" y="624" width="94" height="55" rx="11" class="sub"/><circle cx="439" cy="640" r="11" fill="#eaf0ff"/><text x="439" y="644" text-anchor="middle" font-size="10" font-weight="800" fill="#2457ff">1</text><text x="439" y="660" text-anchor="middle" font-size="11" class="strong">Observe</text><text x="439" y="674" text-anchor="middle" class="tiny">question + outcomes</text>
    <rect x="496" y="624" width="94" height="55" rx="11" class="sub"/><circle cx="543" cy="640" r="11" fill="#eaf0ff"/><text x="543" y="644" text-anchor="middle" font-size="10" font-weight="800" fill="#2457ff">2</text><text x="543" y="660" text-anchor="middle" font-size="11" class="strong">Decide</text><text x="543" y="674" text-anchor="middle" class="tiny">model action</text>
    <rect x="600" y="624" width="94" height="55" rx="11" class="sub"/><circle cx="647" cy="640" r="11" fill="#eaf0ff"/><text x="647" y="644" text-anchor="middle" font-size="10" font-weight="800" fill="#2457ff">3</text><text x="647" y="660" text-anchor="middle" font-size="11" class="strong">Act</text><text x="647" y="674" text-anchor="middle" class="tiny">execute / validate</text>
  </g>
  <rect x="392" y="687" width="302" height="14" rx="7" fill="#eef3ff"/><text x="543" y="698" text-anchor="middle" font-size="9.5" font-weight="700" fill="#36528c">Model chooses semantic action · runtime controls execution &amp; safety</text>

  <g filter="url(#shadow)"><rect x="48" y="470" width="255" height="278" rx="20" class="card"/></g>
  <rect x="67" y="492" width="44" height="44" rx="12" fill="url(#purple)"/>
  <path d="M76 503h26v18H81l-5 5z" fill="none" stroke="#fff" stroke-width="2"/><path d="M82 509h14M82 515h9" stroke="#fff" stroke-width="2"/>
  <text x="124" y="505" class="kicker">FEEDBACK CHANNEL</text><text x="124" y="530" class="title">Observable State</text>
  <text x="67" y="562" class="body"><tspan x="67">Only visible execution state is fed into</tspan><tspan x="67" dy="18">the next decision. No hidden chain-of-</tspan><tspan x="67" dy="18">thought is requested or logged.</tspan></text>
  <g transform="translate(67,624)">
    <rect x="0" y="0" width="100" height="26" rx="10" class="sub"/><text x="50" y="17" text-anchor="middle" font-size="10" class="strong">Question</text>
    <rect x="110" y="0" width="107" height="26" rx="10" class="sub"/><text x="163.5" y="17" text-anchor="middle" font-size="10" class="strong">Chosen action</text>
    <rect x="0" y="36" width="100" height="26" rx="10" class="sub"/><text x="50" y="53" text-anchor="middle" font-size="10" class="strong">Tool args</text>
    <rect x="110" y="36" width="107" height="26" rx="10" class="sub"/><text x="163.5" y="53" text-anchor="middle" font-size="10" class="strong">Result / error</text>
  </g>

  <g filter="url(#shadow)"><rect x="782" y="470" width="770" height="278" rx="20" class="card"/></g>
  <rect x="801" y="492" width="44" height="44" rx="12" fill="url(#orange)"/>
  <path d="M823 500l13 5v9c0 10-6 16-13 20-7-4-13-10-13-20v-9z" fill="none" stroke="#fff" stroke-width="2"/><path d="M817 515l4 4 8-9" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="858" y="505" class="kicker">SAFETY &amp; OUTPUT LAYER</text><text x="858" y="530" class="title">Provenance Gate</text>
  <g transform="translate(801,553)">
    <rect x="0" y="0" width="185" height="34" rx="11" class="sub"/><text x="92.5" y="22" text-anchor="middle" font-size="11" class="strong">FinalAction</text>
    <text x="206" y="23" font-size="22" font-weight="800" fill="#d97706">&gt;</text>
    <rect x="236" y="0" width="250" height="34" rx="11" class="sub"/><text x="361" y="22" text-anchor="middle" font-size="11" class="strong">Validate cited evidence</text>
    <text x="505" y="23" font-size="22" font-weight="800" fill="#d97706">&gt;</text>
    <rect x="535" y="0" width="199" height="34" rx="11" class="sub"/><text x="634.5" y="22" text-anchor="middle" font-size="11" class="strong">Accept / reject</text>
  </g>
  <rect x="801" y="608" width="355" height="83" rx="13" class="sub"/><text x="817" y="628" font-size="11.5" class="strong">Gate guarantees</text>
  <text x="817" y="648" class="tiny"><tspan x="817">• at least one successful read_note</tspan><tspan x="817" dy="16">• every cited evidence ID was read this run</tspan><tspan x="817" dy="16">• unsupported finals can be rejected</tspan></text>
  <rect x="1175" y="608" width="358" height="83" rx="13" class="sub"/><text x="1191" y="628" font-size="11.5" class="strong">Outside this prototype</text>
  <text x="1191" y="648" class="tiny"><tspan x="1191">• natural-language truth verification</tspan><tspan x="1191" dy="16">• automatic repair of malformed output</tspan><tspan x="1191" dy="16">• production prompt-injection defenses</tspan></text>
  <rect x="801" y="704" width="732" height="26" rx="10" fill="#f6f3ff" stroke="#e1d8ff"/><text x="817" y="721" font-size="10.5" fill="#574685"><tspan font-weight="750">Run outcomes:</tspan> completed · final_rejected · max_steps. Tool errors become observations for possible recovery.</text>

  <path d="M303 260 H350" fill="none" stroke="#2457ff" stroke-width="3.5" marker-end="url(#blueA)"/>
  <rect x="304" y="232" width="46" height="18" rx="9" fill="#f5f7fb"/><text x="327" y="245" text-anchor="middle" class="arrowlbl" fill="#2457ff">question</text>
  <path d="M543 415 V460" fill="none" stroke="#2457ff" stroke-width="3.5" marker-end="url(#blueA)"/>
  <rect x="553" y="426" width="105" height="18" rx="9" fill="#f5f7fb"/><text x="605" y="439" text-anchor="middle" class="arrowlbl" fill="#2457ff">structured action</text>
  <path d="M725 590 H753 V385 H772" fill="none" stroke="#d97706" stroke-width="3.5" marker-end="url(#orangeA)"/>
  <rect x="703" y="550" width="88" height="18" rx="9" fill="#f5f7fb"/><text x="747" y="563" text-anchor="middle" class="arrowlbl" fill="#d97706">execute tool</text>
  <path d="M725 665 H772" fill="none" stroke="#d97706" stroke-width="3.5" marker-end="url(#orangeA)"/>
  <rect x="702" y="676" width="92" height="18" rx="9" fill="#f5f7fb"/><text x="748" y="689" text-anchor="middle" class="arrowlbl" fill="#d97706">final action</text>
  <path d="M1395 415 V790 H176 V758" fill="none" stroke="#6d4aff" stroke-width="3.5" marker-end="url(#purpleA)"/>
  <rect x="612" y="778" width="380" height="22" rx="11" fill="#f5f7fb"/><text x="802" y="793" text-anchor="middle" font-size="10.5" font-weight="800" fill="#6d4aff">tool result / error - observable state - next model decision</text>
  <path d="M303 610 H326 V330 H350" fill="none" stroke="#6d4aff" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#purpleA)"/>
  <rect x="293" y="445" width="73" height="18" rx="9" fill="#f5f7fb"/><text x="329.5" y="458" text-anchor="middle" class="arrowlbl" fill="#6d4aff">next step</text>

  <line x1="48" y1="842" x2="1552" y2="842" stroke="#d7dfea"/>
  <text x="48" y="868" font-size="12" class="muted"><tspan font-weight="800" fill="#26364d">Key principle:</tspan> The model controls the next semantic action; the runtime controls execution and safety.</text>
  <text x="1552" y="868" text-anchor="end" font-size="11" class="muted">Research Evidence Agent · Technical Interview Prototype</text>
</svg>