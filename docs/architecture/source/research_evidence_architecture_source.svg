<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Research Evidence Agent system architecture</title>
  <desc id="description">A question flows to a decision model and then to the ResearchAgent runtime. Tool actions execute through a deterministic registry, results enter observable state, and that state feeds the next model decision. Final actions pass through a provenance gate.</desc>

  <!-- Editable source. Keep geometry explicit so the GitHub-rendered export remains portable. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#0f8a63"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c66a08"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6d4ed7"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #d7e0eb; stroke-width: 1.5; }
      .eyebrow { fill: #64748b; font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { fill: #142033; font-size: 24px; font-weight: 700; }
      .body { fill: #53657d; font-size: 14px; }
      .detail { fill: #334155; font-size: 13px; font-weight: 600; }
      .small { fill: #607089; font-size: 12px; }
      .label { font-size: 12px; font-weight: 700; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1500" cy="45" r="190" fill="#e5edff" opacity="0.55"/>
  <circle cx="80" cy="850" r="200" fill="#eee9ff" opacity="0.45"/>

  <!-- Header -->
  <text x="60" y="66" fill="#142033" font-size="34" font-weight="750">Research Evidence Agent</text>
  <text x="60" y="98" fill="#607089" font-size="16">Model-directed next actions with deterministic execution, observable evidence, and bounded validation.</text>
  <g transform="translate(1195 47)">
    <rect width="345" height="38" rx="19" fill="#ffffff" stroke="#d7e0eb"/>
    <circle cx="22" cy="19" r="5" fill="#2563eb"/>
    <text x="35" y="24" fill="#52647b" font-size="12" font-weight="650">Model decision</text>
    <circle cx="142" cy="19" r="5" fill="#0f8a63"/>
    <text x="155" y="24" fill="#52647b" font-size="12" font-weight="650">Deterministic</text>
    <circle cx="258" cy="19" r="5" fill="#6d4ed7"/>
    <text x="271" y="24" fill="#52647b" font-size="12" font-weight="650">Evidence</text>
  </g>

  <!-- User Question -->
  <g filter="url(#shadow)"><rect class="card" x="60" y="180" width="250" height="250" rx="18"/></g>
  <rect x="82" y="204" width="44" height="44" rx="12" fill="#2563eb"/>
  <circle cx="104" cy="219" r="7" fill="#ffffff"/>
  <path d="M91 240 C93 230 115 230 117 240" fill="#ffffff"/>
  <text class="eyebrow" x="142" y="219">INPUT</text>
  <text class="heading" x="82" y="282">User Question</text>
  <text class="body" x="82" y="315">
    <tspan x="82">A natural-language goal for</tspan>
    <tspan x="82" dy="21">the local evidence corpus.</tspan>
  </text>
  <rect x="82" y="365" width="206" height="42" rx="10" fill="#f5f8fc" stroke="#dce4ee"/>
  <text class="small" x="97" y="383">Facts · comparisons · constraints</text>
  <text class="small" x="97" y="399">or unavailable measurements</text>

  <!-- DecisionModel -->
  <g filter="url(#shadow)"><rect class="card" x="390" y="180" width="310" height="250" rx="18"/></g>
  <rect x="412" y="204" width="44" height="44" rx="12" fill="#2563eb"/>
  <rect x="422" y="214" width="24" height="24" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="434" cy="226" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="eyebrow" x="472" y="219">SEMANTIC DECISION</text>
  <text class="heading" x="412" y="282">DecisionModel</text>
  <text class="body" x="412" y="315">
    <tspan x="412">Chooses one next action from</tspan>
    <tspan x="412" dy="21">the question, tool schemas, and prior</tspan>
    <tspan x="412" dy="21">observable outcomes.</tspan>
  </text>
  <rect x="412" y="382" width="126" height="26" rx="8" fill="#edf3ff"/>
  <text class="detail" x="475" y="400" text-anchor="middle" fill="#2555aa">ToolAction</text>
  <rect x="550" y="382" width="128" height="26" rx="8" fill="#edf3ff"/>
  <text class="detail" x="614" y="400" text-anchor="middle" fill="#2555aa">FinalAction</text>

  <!-- ResearchAgent Runtime -->
  <g filter="url(#shadow)"><rect class="card" x="780" y="180" width="360" height="250" rx="18"/></g>
  <rect x="802" y="204" width="44" height="44" rx="12" fill="#c66a08"/>
  <path d="M824 211 L828 220 L838 221 L830 228 L833 238 L824 233 L815 238 L818 228 L810 221 L820 220 Z" fill="#ffffff"/>
  <text class="eyebrow" x="862" y="219">DETERMINISTIC RUNTIME</text>
  <text class="heading" x="802" y="282">ResearchAgent Runtime</text>
  <text class="body" x="802" y="315">
    <tspan x="802">Parses actions, dispatches registered tools,</tspan>
    <tspan x="802" dy="21">records observations, handles errors, and</tspan>
    <tspan x="802" dy="21">enforces the configured step limit.</tspan>
  </text>
  <g transform="translate(802 382)">
    <rect width="94" height="28" rx="9" fill="#fff7ed" stroke="#f1d5b4"/><text class="detail" x="47" y="19" text-anchor="middle">Observe</text>
    <rect x="108" width="94" height="28" rx="9" fill="#fff7ed" stroke="#f1d5b4"/><text class="detail" x="155" y="19" text-anchor="middle">Decide</text>
    <rect x="216" width="120" height="28" rx="9" fill="#fff7ed" stroke="#f1d5b4"/><text class="detail" x="276" y="19" text-anchor="middle">Act / validate</text>
  </g>

  <!-- Provenance Gate -->
  <g filter="url(#shadow)"><rect class="card" x="1220" y="180" width="320" height="250" rx="18"/></g>
  <rect x="1242" y="204" width="44" height="44" rx="12" fill="#c66a08"/>
  <path d="M1264 211 L1277 216 V225 C1277 235 1271 241 1264 245 C1257 241 1251 235 1251 225 V216 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M1258 226 L1262 230 L1270 220" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="eyebrow" x="1302" y="219">SAFETY &amp; OUTPUT</text>
  <text class="heading" x="1242" y="282">Provenance Gate</text>
  <text class="body" x="1242" y="315">
    <tspan x="1242">Validates final evidence IDs against</tspan>
    <tspan x="1242" dy="21">documents read during this run.</tspan>
  </text>
  <rect x="1242" y="365" width="276" height="43" rx="10" fill="#fff7ed" stroke="#f1d5b4"/>
  <text class="detail" x="1380" y="383" text-anchor="middle">Accepted final answer</text>
  <text class="small" x="1380" y="399" text-anchor="middle">or final_rejected</text>

  <!-- Observable State -->
  <g filter="url(#shadow)"><rect class="card" x="390" y="535" width="310" height="230" rx="18"/></g>
  <rect x="412" y="559" width="44" height="44" rx="12" fill="#6d4ed7"/>
  <path d="M421 569 H447 V588 H428 L421 595 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M427 576 H441 M427 582 H437" stroke="#ffffff" stroke-width="2"/>
  <text class="eyebrow" x="472" y="574">FEEDBACK CHANNEL</text>
  <text class="heading" x="412" y="637">Observable State</text>
  <text class="body" x="412" y="670">
    <tspan x="412">Tool calls and outcomes are visible</tspan>
    <tspan x="412" dy="21">to the next model decision.</tspan>
  </text>
  <rect x="412" y="718" width="266" height="26" rx="8" fill="#f5f2ff"/>
  <text class="small" x="545" y="736" text-anchor="middle">step · tool · arguments · result / error</text>

  <!-- ToolRegistry and Tools -->
  <g filter="url(#shadow)"><rect class="card" x="780" y="535" width="760" height="230" rx="18"/></g>
  <rect x="802" y="559" width="44" height="44" rx="12" fill="#0f8a63"/>
  <path d="M811 574 H837 V594 H811 Z M818 574 V569 H830 V574 M811 581 H837" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text class="eyebrow" x="862" y="574">DETERMINISTIC TOOL LAYER</text>
  <text class="heading" x="802" y="637">ToolRegistry &amp; Tools</text>
  <text class="body" x="802" y="670">An explicit registry exposes exactly four ordinary-Python operations.</text>
  <g transform="translate(802 704)">
    <rect width="164" height="39" rx="10" fill="#f1faf6" stroke="#cde7dc"/><text class="detail" x="82" y="24" text-anchor="middle">search_notes</text>
    <rect x="178" width="164" height="39" rx="10" fill="#f1faf6" stroke="#cde7dc"/><text class="detail" x="260" y="24" text-anchor="middle">read_note</text>
    <rect x="356" width="164" height="39" rx="10" fill="#f1faf6" stroke="#cde7dc"/><text class="detail" x="438" y="24" text-anchor="middle">calculate</text>
    <rect x="534" width="182" height="39" rx="10" fill="#f1faf6" stroke="#cde7dc"/><text class="detail" x="625" y="24" text-anchor="middle">check_constraints</text>
  </g>

  <!-- Forward flow: endpoints stay in open gutters; compact markers avoid card borders. -->
  <path class="flow" d="M320 305 H380" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="312" y="273" width="76" height="22" rx="11" fill="#f3f6fa"/>
  <text class="label" x="350" y="289" text-anchor="middle" fill="#2563eb">question</text>

  <path class="flow" d="M710 305 H770" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <rect x="702" y="265" width="76" height="34" rx="12" fill="#f3f6fa"/>
  <text class="label" x="740" y="279" text-anchor="middle" fill="#2563eb" font-size="10"><tspan x="740">structured</tspan><tspan x="740" dy="13">action</tspan></text>

  <path class="flow" d="M1150 305 H1210" stroke="#c66a08" marker-end="url(#arrow-amber)"/>
  <rect x="1145" y="265" width="60" height="34" rx="12" fill="#f3f6fa"/>
  <text class="label" x="1175" y="279" text-anchor="middle" fill="#c66a08"><tspan x="1175">final</tspan><tspan x="1175" dy="13">action</tspan></text>

  <path class="flow" d="M960 440 V525" stroke="#0f8a63" marker-end="url(#arrow-green)"/>
  <rect x="974" y="467" width="100" height="22" rx="11" fill="#f3f6fa"/>
  <text class="label" x="1024" y="483" text-anchor="middle" fill="#0f8a63">execute tool</text>

  <path class="flow" d="M770 650 H710" stroke="#6d4ed7" marker-end="url(#arrow-purple)"/>
  <rect x="721" y="610" width="58" height="34" rx="12" fill="#f3f6fa"/>
  <text class="label" x="750" y="624" text-anchor="middle" fill="#6d4ed7"><tspan x="750">result</tspan><tspan x="750" dy="13">/ error</tspan></text>

  <!-- Feedback is routed entirely through the open gutter below and left of the cards. -->
  <path class="flow" d="M545 775 V820 H350 V465 H545 V440" stroke="#6d4ed7" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <rect x="362" y="785" width="166" height="23" rx="11.5" fill="#f3f6fa"/>
  <text class="label" x="445" y="801" text-anchor="middle" fill="#6d4ed7">next model decision</text>

  <!-- Footer -->
  <line x1="60" y1="846" x2="1540" y2="846" stroke="#d4dde8"/>
  <text x="60" y="875" fill="#607089" font-size="12"><tspan font-weight="700" fill="#334155">Design principle:</tspan> the model selects semantic actions; deterministic code controls execution, evidence, and stopping.</text>
  <text x="1540" y="875" text-anchor="end" fill="#607089" font-size="12">Research Evidence Agent · Agentic AI Prototype</text>
</svg>
