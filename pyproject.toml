[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-evidence-agent"
version = "0.1.0"
description = "A small, explainable research evidence agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
colab = ["torch>=2.1", "transformers>=4.37"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
